<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simple-dlp</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center">
    <div class="w-full max-w-lg mx-4">
        <h1 class="text-3xl font-bold mb-1">simple-dlp</h1>
        <p class="text-gray-400 mb-6">YouTube downloader optimized for video editors</p>

        <div class="flex gap-2 mb-4">
            <input
                type="text"
                id="urlInput"
                placeholder="Paste YouTube URL here..."
                class="flex-1 px-4 py-3 bg-gray-800 border border-gray-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition"
            />
            <button
                id="loadPlaylistBtn"
                class="px-4 py-3 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm font-medium whitespace-nowrap transition"
            >
                Load List
            </button>
        </div>

        <div id="playlistContainer" class="hidden mb-4">
            <div class="bg-gray-800 border border-gray-700 rounded-lg p-3">
                <p id="playlistTitle" class="text-sm font-semibold mb-2 truncate"></p>
                <p id="singleVideoTitle" class="text-sm text-gray-400 hidden"></p>
                <div id="playlistEntries" class="max-h-48 overflow-y-auto space-y-1 mb-2"></div>
                <div id="playlistActions" class="flex gap-2 text-xs">
                    <button id="selectAllBtn" class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded hidden">Select All</button>
                    <button id="deselectAllBtn" class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded hidden">Deselect All</button>
                </div>
            </div>
        </div>

        <label class="text-gray-400 text-xs mb-1 block">Mode</label>
        <select id="modeSelect" class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg mb-4 text-white text-sm focus:outline-none focus:border-blue-500 transition">
            <option value="video+audio">Video + Audio</option>
            <option value="video">Video Only</option>
            <option value="audio">Audio Only</option>
        </select>

        <div id="videoQualityRow" class="mb-4">
            <label class="text-gray-400 text-xs mb-1 block">Video Quality</label>
            <select id="videoQualitySelect" class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-white text-sm focus:outline-none focus:border-blue-500 transition">
                <option value="best">Best</option>
                <option value="2160">4K (2160p)</option>
                <option value="1440">1440p</option>
                <option value="1080">1080p</option>
                <option value="720">720p</option>
                <option value="480">480p</option>
                <option value="360">360p</option>
            </select>
        </div>

        <div id="audioQualityRow" class="mb-4">
            <label class="text-gray-400 text-xs mb-1 block">Audio Quality</label>
            <select id="audioQualitySelect" class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-white text-sm focus:outline-none focus:border-blue-500 transition">
                <option value="best">Best</option>
                <option value="192">192 kbps</option>
                <option value="128">128 kbps</option>
                <option value="96">96 kbps</option>
                <option value="64">64 kbps</option>
            </select>
        </div>

        <div class="mb-4">
            <button id="clipToggle" class="flex items-center gap-2 text-gray-400 text-xs hover:text-white transition">
                <span id="clipArrow">&#9654;</span> Clip
            </button>
            <div id="clipSection" class="hidden mt-2 pl-4">
                <div class="flex gap-3">
                    <div class="flex-1">
                        <label class="text-gray-500 text-xs mb-1 block">Start (HH:MM:SS)</label>
                        <input
                            type="text"
                            id="clipStart"
                            placeholder="0:00"
                            class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-white text-sm placeholder-gray-600 focus:outline-none focus:border-blue-500 transition"
                        />
                    </div>
                    <div class="flex-1">
                        <label class="text-gray-500 text-xs mb-1 block">End (HH:MM:SS)</label>
                        <input
                            type="text"
                            id="clipEnd"
                            placeholder=""
                            class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-white text-sm placeholder-gray-600 focus:outline-none focus:border-blue-500 transition"
                        />
                    </div>
                </div>
            </div>
        </div>

        <button
            id="downloadBtn"
            class="w-full px-6 py-3 bg-blue-600 hover:bg-blue-700 disabled:bg-gray-700 disabled:cursor-not-allowed rounded-lg font-semibold transition"
        >
            Download High Quality
        </button>

        <div id="statusArea" class="mt-6 hidden">
            <div class="w-full bg-gray-800 rounded-full h-2 mb-3 overflow-hidden">
                <div id="progressFill" class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
            <p id="statusText" class="text-gray-400 text-sm"></p>
        </div>
    </div>

    <script>
        const urlInput = document.getElementById('urlInput');
        const loadPlaylistBtn = document.getElementById('loadPlaylistBtn');
        const playlistContainer = document.getElementById('playlistContainer');
        const playlistTitle = document.getElementById('playlistTitle');
        const singleVideoTitle = document.getElementById('singleVideoTitle');
        const playlistEntries = document.getElementById('playlistEntries');
        const selectAllBtn = document.getElementById('selectAllBtn');
        const deselectAllBtn = document.getElementById('deselectAllBtn');
        const playlistActions = document.getElementById('playlistActions');
        const modeSelect = document.getElementById('modeSelect');
        const videoQualityRow = document.getElementById('videoQualityRow');
        const audioQualityRow = document.getElementById('audioQualityRow');
        const videoQualitySelect = document.getElementById('videoQualitySelect');
        const audioQualitySelect = document.getElementById('audioQualitySelect');
        const clipToggle = document.getElementById('clipToggle');
        const clipArrow = document.getElementById('clipArrow');
        const clipSection = document.getElementById('clipSection');
        const clipStart = document.getElementById('clipStart');
        const clipEnd = document.getElementById('clipEnd');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusArea = document.getElementById('statusArea');
        const progressFill = document.getElementById('progressFill');
        const statusText = document.getElementById('statusText');

        let playlistEntriesData = [];
        let isPlaylist = false;
        let isLoadingList = false;

        function toggleQualityRows() {
            const mode = modeSelect.value;
            videoQualityRow.classList.toggle('hidden', mode === 'audio');
            audioQualityRow.classList.toggle('hidden', mode === 'video');
        }
        modeSelect.addEventListener('change', toggleQualityRows);
        toggleQualityRows();

        clipToggle.addEventListener('click', () => {
            const isHidden = clipSection.classList.toggle('hidden');
            clipArrow.innerHTML = isHidden ? '&#9654;' : '&#9660;';
        });

        function formatDuration(seconds) {
            if (seconds == null) return '';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            const h = Math.floor(m / 60);
            return h ? h + ':' + String(m % 60).padStart(2, '0') + ':' + String(s).padStart(2, '0')
                     : m + ':' + String(s).padStart(2, '0');
        }

        function renderPlaylist() {
            playlistEntries.innerHTML = '';
            if (playlistEntriesData.length === 0) return;

            let checkedCount = 0;
            playlistEntriesData.forEach((entry, idx) => {
                const row = document.createElement('label');
                row.className = 'flex items-center gap-2 px-2 py-1 rounded hover:bg-gray-700 cursor-pointer text-sm';

                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.checked = true;
                cb.className = 'accent-blue-600 cursor-pointer';
                cb.dataset.index = entry.index;
                cb.addEventListener('change', updateDownloadButton);

                const dur = entry.duration ? formatDuration(entry.duration) : '';
                const durSpan = document.createElement('span');
                durSpan.className = 'text-gray-500 ml-auto text-xs';
                durSpan.textContent = dur;

                const titleSpan = document.createElement('span');
                titleSpan.className = 'truncate';
                titleSpan.textContent = entry.index + '. ' + entry.title;

                row.appendChild(cb);
                row.appendChild(titleSpan);
                row.appendChild(durSpan);
                playlistEntries.appendChild(row);
                if (cb.checked) checkedCount++;
            });

            selectAllBtn.classList.remove('hidden');
            deselectAllBtn.classList.remove('hidden');
            updateDownloadButton();
        }

        function getSelectedItems() {
            const cbs = playlistEntries.querySelectorAll('input[type=checkbox]:checked');
            const indices = [];
            cbs.forEach(cb => indices.push(parseInt(cb.dataset.index)));
            if (indices.length === 0) return '';
            const ranges = [];
            let start = indices[0], end = indices[0];
            for (let i = 1; i <= indices.length; i++) {
                if (indices[i] === end + 1) {
                    end = indices[i];
                } else {
                    ranges.push(start === end ? String(start) : start + '-' + end);
                    start = indices[i];
                    end = indices[i];
                }
            }
            return ranges.join(',');
        }

        function updateDownloadButton() {
            if (!isPlaylist) {
                downloadBtn.textContent = 'Download High Quality';
                return;
            }
            if (isLoadingList) {
                downloadBtn.textContent = 'Loading...';
                return;
            }
            const cbs = playlistEntries.querySelectorAll('input[type=checkbox]:checked');
            const count = cbs.length;
            downloadBtn.textContent = count > 0 ? 'Download Selected (' + count + ')' : 'Download High Quality';
        }

        selectAllBtn.addEventListener('click', () => {
            playlistEntries.querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = true);
            updateDownloadButton();
        });

        deselectAllBtn.addEventListener('click', () => {
            playlistEntries.querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = false);
            updateDownloadButton();
        });

        async function loadPlaylist() {
            const url = urlInput.value.trim();
            if (!url) {
                statusArea.classList.remove('hidden');
                progressFill.style.width = '0%';
                statusText.textContent = 'Please enter a URL first.';
                return;
            }

            isLoadingList = true;
            loadPlaylistBtn.disabled = true;
            loadPlaylistBtn.textContent = 'Loading...';
            playlistContainer.classList.add('hidden');
            playlistEntriesData = [];
            isPlaylist = false;
            updateDownloadButton();

            try {
                const response = await fetch('/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, action: 'list' })
                });

                if (!response.ok || !response.body) {
                    statusArea.classList.remove('hidden');
                    statusText.textContent = 'Error: Server returned ' + response.status;
                    isLoadingList = false;
                    loadPlaylistBtn.disabled = false;
                    loadPlaylistBtn.textContent = 'Load List';
                    updateDownloadButton();
                    return;
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const parts = buffer.split('\n\n');
                    buffer = parts.pop() || '';

                    for (const part of parts) {
                        const dataLine = part.replace(/^data:\s*/gm, '').trim();
                        if (!dataLine) continue;
                        try {
                            const event = JSON.parse(dataLine);
                            handleListEvent(event);
                        } catch (e) {}
                    }
                }
            } catch (err) {
                statusArea.classList.remove('hidden');
                progressFill.style.width = '0%';
                statusText.textContent = 'Error: ' + err.message;
            }

            isLoadingList = false;
            loadPlaylistBtn.disabled = false;
            loadPlaylistBtn.textContent = 'Load List';
            updateDownloadButton();
        }

        function handleListEvent(event) {
            statusArea.classList.add('hidden');
            playlistContainer.classList.remove('hidden');

            if (event.status === 'playlist_meta') {
                playlistTitle.textContent = event.title + ' (' + event.count + ' videos)';
                playlistTitle.classList.remove('hidden');
                singleVideoTitle.classList.add('hidden');
                isPlaylist = true;
            } else if (event.status === 'playlist_entry') {
                playlistEntriesData.push(event);
            } else if (event.status === 'playlist_done') {
                if (isPlaylist) {
                    renderPlaylist();
                }
            } else if (event.status === 'single_video') {
                playlistTitle.classList.add('hidden');
                singleVideoTitle.classList.remove('hidden');
                singleVideoTitle.textContent = event.title + (event.duration ? ' (' + formatDuration(event.duration) + ')' : '');
                selectAllBtn.classList.add('hidden');
                deselectAllBtn.classList.add('hidden');
                playlistEntries.innerHTML = '';
                playlistEntriesData = [];
                isPlaylist = false;
                updateDownloadButton();
            } else if (event.status === 'error') {
                playlistContainer.classList.add('hidden');
                statusArea.classList.remove('hidden');
                progressFill.style.width = '0%';
                statusText.textContent = 'Error: ' + (event.message || 'Unknown error');
                isPlaylist = false;
                updateDownloadButton();
            }
        }

        loadPlaylistBtn.addEventListener('click', loadPlaylist);

        function formatPercent(raw) {
            const num = parseFloat(raw);
            return isNaN(num) ? 0 : Math.round(num);
        }

        function handleDownloadEvent(event) {
            if (event.status === 'waiting') {
                statusArea.classList.remove('hidden');
                progressFill.style.width = '0%';
                statusText.textContent = 'Waiting...';
                downloadBtn.disabled = true;
                downloadBtn.textContent = 'Downloading...';
            } else if (event.status === 'downloading') {
                const pct = formatPercent(event.percent_str);
                progressFill.style.width = Math.min(pct, 100) + '%';
                const parts = [];
                if (event.percent_str) parts.push(event.percent_str);
                if (event.speed_str) parts.push(event.speed_str);
                if (event.eta_str) parts.push(event.eta_str);
                statusText.textContent = parts.join(' \u2022 ') || 'Downloading...';
            } else if (event.status === 'finished') {
                progressFill.style.width = '100%';
                statusText.textContent = 'Done! File saved to Downloads folder.';
                downloadBtn.disabled = false;
                downloadBtn.textContent = 'Download High Quality';
            } else if (event.status === 'error') {
                statusArea.classList.remove('hidden');
                progressFill.style.width = '0%';
                statusText.textContent = 'Error: ' + (event.message || 'Unknown error');
                downloadBtn.disabled = false;
                updateDownloadButton();
            }
        }

        downloadBtn.addEventListener('click', async () => {
            const url = urlInput.value.trim();
            if (!url) {
                statusArea.classList.remove('hidden');
                progressFill.style.width = '0%';
                statusText.textContent = 'Please enter a YouTube URL.';
                return;
            }

            try {
                const response = await fetch('/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        url,
                        action: 'download',
                        mode: modeSelect.value,
                        video_quality: videoQualitySelect.value,
                        audio_quality: audioQualitySelect.value,
                        clip_start: clipStart.value.trim(),
                        clip_end: clipEnd.value.trim(),
                        playlist_items: isPlaylist ? getSelectedItems() : '',
                    })
                });

                if (!response.ok || !response.body) {
                    statusArea.classList.remove('hidden');
                    progressFill.style.width = '0%';
                    statusText.textContent = 'Error: Server returned ' + response.status;
                    return;
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const parts = buffer.split('\n\n');
                    buffer = parts.pop() || '';

                    for (const part of parts) {
                        const dataLine = part.replace(/^data:\s*/gm, '').trim();
                        if (!dataLine) continue;
                        try {
                            const event = JSON.parse(dataLine);
                            handleDownloadEvent(event);
                        } catch (e) {}
                    }
                }
            } catch (err) {
                statusArea.classList.remove('hidden');
                progressFill.style.width = '0%';
                statusText.textContent = 'Error: ' + err.message;
                downloadBtn.disabled = false;
                updateDownloadButton();
            }
        });

        urlInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') downloadBtn.click();
        });
    </script>
</body>
</html>
